name: Deploy to Debian
on:
  push:
    branches: [ main ]

env:
  SSH_HOST: sshjhs.jahosi.co.uk
  SSH_USER: dockertunnel
  DEPLOY_PATH: /home/dockertunnel/qglimpse.jahosi.co.uk-2010

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: quickglimpse
    steps:


      - name: Install Cloudflared on Runner
        run: |
          set -euo pipefail
          curl -fL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version


      - name: Configure SSH over Cloudflare
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/config << EOF
          Host ${SSH_HOST}
            HostName ${SSH_HOST}
            StrictHostKeyChecking no
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --loglevel debug
          EOF
          chmod 600 ~/.ssh/config

      - name: Build Secure .env File
        env:
          # Pull SECRETS
          QUICKGLIMPSE_DB_PATH: ${{ secrets.QUICKGLIMPSE_DB_PATH }}
          QUICKGLIMPSE_DATA_DIR: ${{ secrets.QUICKGLIMPSE_DATA_DIR }}
          QUICKGLIMPSE_DB_ENCRYPTION_KEY: ${{ secrets.QUICKGLIMPSE_DB_ENCRYPTION_KEY }}
          QUICKGLIMPSE_ROOT_SEED_PASSWORD: ${{ secrets.QUICKGLIMPSE_ROOT_SEED_PASSWORD }}
          QUICKGLIMPSE_INSTITUTION_SEED_PASSWORD: ${{ secrets.QUICKGLIMPSE_INSTITUTION_SEED_PASSWORD }}
          QUICKGLIMPSE_SESSION_SECRET: ${{ secrets.QUICKGLIMPSE_SESSION_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Pull VARIABLES
          NODE_ENV: ${{ vars.NODE_ENV }}
          QUICKGLIMPSE_BASE_URL: ${{ vars.QUICKGLIMPSE_BASE_URL }}
          QUICKGLIMPSE_TRUST_PROXY: ${{ vars.QUICKGLIMPSE_TRUST_PROXY }}
          QUICKGLIMPSE_SESSION_TTL_MS: ${{ vars.QUICKGLIMPSE_SESSION_TTL_MS }}
          QUICKGLIMPSE_SESSION_IDLE_TTL_MS: ${{ vars.QUICKGLIMPSE_SESSION_IDLE_TTL_MS }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE_LOGIN_TYPE: ${{ vars.SMTP_SECURE_LOGIN_TYPE }}
          SMTP_SEND_ADDRESS: ${{ vars.SMTP_SEND_ADDRESS }}
          SMTP_SERVER_ADDRESS: ${{ vars.SMTP_SERVER_ADDRESS }}
        run: |
          set -euo pipefail
          # Write all variables into a local .env file on the runner
          echo "QUICKGLIMPSE_DB_PATH=$QUICKGLIMPSE_DB_PATH" > .env
          echo "QUICKGLIMPSE_DATA_DIR=$QUICKGLIMPSE_DATA_DIR" >> .env
          echo "QUICKGLIMPSE_DB_ENCRYPTION_KEY=$QUICKGLIMPSE_DB_ENCRYPTION_KEY" >> .env
          echo "QUICKGLIMPSE_ROOT_SEED_PASSWORD=$QUICKGLIMPSE_ROOT_SEED_PASSWORD" >> .env
          echo "QUICKGLIMPSE_INSTITUTION_SEED_PASSWORD=$QUICKGLIMPSE_INSTITUTION_SEED_PASSWORD" >> .env
          echo "QUICKGLIMPSE_SESSION_SECRET=$QUICKGLIMPSE_SESSION_SECRET" >> .env
          echo "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY" >> .env
          echo "TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY" >> .env
          echo "SMTP_USERNAME=$SMTP_USERNAME" >> .env
          echo "SMTP_PASSWORD=$SMTP_PASSWORD" >> .env
          echo "NODE_ENV=$NODE_ENV" >> .env
          echo "QUICKGLIMPSE_BASE_URL=$QUICKGLIMPSE_BASE_URL" >> .env
          echo "QUICKGLIMPSE_TRUST_PROXY=$QUICKGLIMPSE_TRUST_PROXY" >> .env
          echo "QUICKGLIMPSE_SESSION_TTL_MS=$QUICKGLIMPSE_SESSION_TTL_MS" >> .env
          echo "QUICKGLIMPSE_SESSION_IDLE_TTL_MS=$QUICKGLIMPSE_SESSION_IDLE_TTL_MS" >> .env
          echo "SMTP_PORT=$SMTP_PORT" >> .env
          echo "SMTP_SECURE_LOGIN_TYPE=$SMTP_SECURE_LOGIN_TYPE" >> .env
          echo "SMTP_SEND_ADDRESS=$SMTP_SEND_ADDRESS" >> .env
          echo "SMTP_SERVER_ADDRESS=$SMTP_SERVER_ADDRESS" >> .env

          echo "Environment variables written to .env file successfully."
          echo "[debug] .env line count: $(wc -l < .env)"
          while IFS='=' read -r k v; do
            if [ -n "$v" ]; then echo "[debug] $k: key is NOT blank"; else echo "[debug] $k: key IS BLANK"; fi
          done < .env


      - name: Deploy to Server via Tunnel
        env:
          # cloudflared reads the Access service token from these variable names
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$TUNNEL_SERVICE_TOKEN_ID" ]; then echo "[debug] TUNNEL_SERVICE_TOKEN_ID: key is NOT blank"; else echo "[debug] TUNNEL_SERVICE_TOKEN_ID: key IS BLANK"; fi
          if [ -n "$TUNNEL_SERVICE_TOKEN_SECRET" ]; then echo "[debug] TUNNEL_SERVICE_TOKEN_SECRET: key is NOT blank"; else echo "[debug] TUNNEL_SERVICE_TOKEN_SECRET: key IS BLANK"; fi

          echo "[debug] Probing Cloudflare Access for ${SSH_HOST}"
          curl --silent --show-error --output /tmp/access-preflight-body.txt --write-out "[debug] Access preflight HTTP status: %{http_code}\n" \
            -H "CF-Access-Client-Id: ${TUNNEL_SERVICE_TOKEN_ID}" \
            -H "CF-Access-Client-Secret: ${TUNNEL_SERVICE_TOKEN_SECRET}" \
            "https://${SSH_HOST}/cdn-cgi/access/get-identity" || true

          # 1. Securely copy the .env file through the Cloudflare Tunnel to your app folder
          scp -v .env ${SSH_HOST}:${DEPLOY_PATH}/.env
          
          # 2. Run the deployment commands through the Tunnel
          ssh -v ${SSH_HOST} "cd ${DEPLOY_PATH} && git pull origin main && docker compose up -d --build"
          echo "Deployment finished successfully."

